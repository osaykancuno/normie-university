name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Foundry tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv
        env:
          FOUNDRY_PROFILE: ci

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci

      # Non-blocking: the repo carries pre-existing react-hooks lint findings in
      # UI hooks unrelated to the protocol layer. Surfaced, but not a merge gate.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

  drift:
    name: Skill <-> oracle drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci

      # Structural drift check: every seeded skill's verification spec must be
      # serviceable by the oracle (supported chain, well-formed addresses +
      # selectors). Uses public RPCs; override with RPC_URL_<id> secrets.
      # Add --onchain locally / in a scheduled job to also assert bytecode
      # presence on the declared chain.
      - name: Check drift
        run: npm run check:drift
        env:
          RPC_URL_11155111: ${{ secrets.RPC_URL_11155111 }}
          RPC_URL_1: ${{ secrets.RPC_URL_1 }}
